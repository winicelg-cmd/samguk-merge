<!DOCTYPE html>

	<head>
		<meta charset="utf-8">

		<title>삼국머지</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #fbf3e2;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#fbf3e2">
<script>
// 원스토어 H5 Game SDK 연결 상태. Godot(scripts/OneStoreWeb.gd)와 이 객체로 주고받습니다.
window.samguk = { sdk: null, ready: null, env: null, godot: null, backResult: false };
// 익명 통계: 브라우저에서는 sendBeacon으로 보냅니다(사전 요청 없이 text/plain 전송)
// 소리 잠금 풀기: 원스토어 앱(WebView) 안에서는 화면을 만지는 그 순간에만 소리 장치를 켤 수 있는 경우가 있어,
// 게임이 만든 AudioContext를 모아 두었다가 손가락이 닿을 때마다 바로 깨웁니다. 앱으로 돌아왔을 때(resume)도 깨웁니다.
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	if (!AC) return;
	const list = [];
	class SamgukAudioContext extends AC {
		constructor(opts) { super(opts); list.push(this); }
	}
	window.AudioContext = SamgukAudioContext;
	if (window.webkitAudioContext) window.webkitAudioContext = SamgukAudioContext;
	const wake = function () {
		list.forEach(function (c) { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(function () {}); });
	};
	['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'click', 'keydown'].forEach(function (ev) {
		window.addEventListener(ev, wake, { capture: true, passive: true });
	});
	document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });
	window.samgukAudioContexts = list;
	window.samgukWakeAudio = wake;
}());
window.samgukBeacon = function (url, body) {
	try { return navigator.sendBeacon(url, new Blob([body], { type: 'text/plain;charset=UTF-8' })); } catch (e) { return false; }
};
</script>
<script type="module">
const S = window.samguk;
S.ready = (async function () {
	let mod;
	try {
		mod = await import('https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js');
	} catch (e) {
		console.warn('원스토어 SDK를 불러오지 못했습니다(원스토어 앱 밖에서 실행 중일 수 있음)', e);
		return false;
	}
	const sdk = mod.createSDK();
	sdk.on('pause', function (ev) { if (S.godot) S.godot.onPause(ev && ev.reason || ''); });
	sdk.on('resume', function () {
		if (window.samgukWakeAudio) window.samgukWakeAudio();
		if (S.godot) S.godot.onResume();
	});
	sdk.on('exit', function () { if (S.godot) S.godot.onExit(); });
	sdk.onBackPressed(function () {
		if (!S.godot) return false;
		S.backResult = false;
		try { S.godot.onBack(); } catch (e) { return false; }
		return S.backResult === true;
	});
	try {
		const info = await sdk.initializeAsync();
		if (info && info.err) { console.warn('원스토어 앱 밖 환경:', info.err); return false; }
		// 무음(진동) 모드라도 게임 소리는 끄지 않습니다(안드로이드에서 게임 소리는 미디어 볼륨을 따름). 소리는 게임 설정에서 끕니다.
		S.sdk = sdk; S.env = info || {};
		return true;
	} catch (e) {
		console.warn('원스토어 SDK 초기화 실패', e && e.reason, e && e.message);
		return false;
	}
}());
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":37891408,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					if (window.samguk.sdk) window.samguk.sdk.setLoadingProgress(Math.min(99, Math.floor(current * 100 / total)));
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			const S = window.samguk;
			Promise.resolve(S.ready).then((ok) => {
				if (!ok || !S.sdk) return;
				S.sdk.setLoadingProgress(100);
				S.sdk.startGameAsync().catch((e) => console.error('startGameAsync 실패', e && e.reason, e && e.message));
			});
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
